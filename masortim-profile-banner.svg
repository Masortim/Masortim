<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="816" height="220" viewBox="0 0 816 220" role="img" aria-labelledby="title description">
  <title id="title">Ideas made useful.</title>
  <desc id="description">Developer and research-minded builder. Web tools, graph experiments and machine-learning projects—with a focus on clear, practical outcomes.</desc>
  <!-- Separate raster background layer. Keep masortim-profile-bg.png next to this SVG in the repository. -->
  <image href="masortim-profile-bg.png" x="0" y="0" width="816" height="220" preserveAspectRatio="xMidYMid slice" />
  <!-- Text remains vector text, layered above the background rather than rasterized into the PNG. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="28" y="40" fill="#77e3d7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.5">DEVELOPER · RESEARCH-MINDED BUILDER</text>
    <text x="28" y="84" fill="#f0f6fc" font-size="27" font-weight="700" letter-spacing="-0.5">Ideas made useful.</text>
    <text x="28" y="114" fill="#e6edf3" font-size="13">Web tools, graph experiments and machine-learning projects—</text>
    <text x="28" y="133" fill="#e6edf3" font-size="13">with a focus on clear, practical outcomes.</text>
    <a href="https://github.com/Masortim?tab=repositories" xlink:href="https://github.com/Masortim?tab=repositories" target="_blank" rel="noopener">
      <text x="28" y="173" fill="#b4f4eb" font-size="12" font-weight="600">Explore selected repositories</text>
      <text x="211" y="173" fill="#b4f4eb" font-size="12" font-weight="600">→</text>
    </a>
  </g>
  <style>
    a:hover text { fill: #ffffff; }
  </style>
</svg>
